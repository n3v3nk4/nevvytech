<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEVVY TECH · Clientes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #0a1628; color: #e2e8f0; }
        .sidebar { background: #0f1a2e; border-right: 1px solid rgba(255,255,255,0.06); width: 220px; height: 100vh; position: fixed; top: 0; left: 0; padding: 20px 0; }
        .sidebar a { display: block; padding: 12px 20px; color: #94a3b8; transition: all 0.3s; text-decoration: none; border-radius: 8px; margin: 0 10px; }
        .sidebar a:hover, .sidebar a.active { background: rgba(59, 130, 246, 0.1); color: #60a5fa; }
        .main-content { margin-left: 220px; padding: 24px; }
        .card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 16px; padding: 20px; }
        .tabla { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .tabla th { text-align: left; padding: 10px 12px; background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.06); color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 0.7rem; }
        .tabla td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .btn-primary { background: linear-gradient(135deg, #1a56db, #3b82f6); padding: 8px 16px; border-radius: 8px; color: white; font-weight: 600; border: none; cursor: pointer; transition: all 0.3s; }
        .btn-primary:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(59,130,246,0.3); }
        .btn-success { background: linear-gradient(135deg, #059669, #10b981); padding: 8px 16px; border-radius: 8px; color: white; font-weight: 600; border: none; cursor: pointer; transition: all 0.3s; }
        .btn-success:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(16,185,129,0.3); }
        .btn-danger { background: linear-gradient(135deg, #dc2626, #ef4444); padding: 8px 16px; border-radius: 8px; color: white; font-weight: 600; border: none; cursor: pointer; transition: all 0.3s; }
        .btn-danger:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(239,68,68,0.3); }
        .logo-text { font-size: 22px; font-weight: 900; color: white; padding: 0 20px; margin-bottom: 20px; }
        .logo-text span { color: #3b82f6; }
        .input-dark { background: #0f1a2e; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; padding: 10px 14px; color: white; outline: none; transition: border-color 0.3s; }
        .input-dark:focus { border-color: #3b82f6; }
        .input-dark::placeholder { color: #475569; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; }
        .modal { background: #1a2744; border-radius: 20px; padding: 40px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { font-size: 20px; font-weight: 700; color: white; }
        .modal-close { background: none; border: none; color: #94a3b8; font-size: 28px; cursor: pointer; transition: color 0.3s; }
        .modal-close:hover { color: white; }
        .btn-sm { padding: 4px 10px; font-size: 0.7rem; border-radius: 6px; border: none; cursor: pointer; transition: all 0.3s; }
        .btn-edit { background: rgba(59,130,246,0.2); color: #60a5fa; }
        .btn-edit:hover { background: rgba(59,130,246,0.4); }
        .btn-delete { background: rgba(239,68,68,0.2); color: #f87171; }
        .btn-delete:hover { background: rgba(239,68,68,0.4); }
        .btn-whatsapp { background: rgba(37,211,102,0.2); color: #4ade80; }
        .btn-whatsapp:hover { background: rgba(37,211,102,0.4); }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo-text">NEVVY <span>TECH</span></div>
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="ventas.html">🛒 Ventas</a>
        <a href="clientes.html" class="active">👤 Clientes</a>
        <a href="cotizaciones.html">📄 Cotizaciones</a>
        <a href="login.html" onclick="cerrarSesion()" style="color:#f87171; margin-top: 20px;">🚪 Cerrar Sesión</a>
    </div>

    <!-- CONTENIDO -->
    <div class="main-content">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-white">👤 Gestión de Clientes</h2>
            <span class="text-sm text-slate-400" id="fechaHora"></span>
        </div>

        <div class="flex flex-wrap gap-3 mb-6">
            <button onclick="abrirModal()" class="btn-success">➕ Nuevo Cliente</button>
        </div>

        <div class="card">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-semibold text-white">📋 Listado de Clientes</h3>
                <span class="text-xs text-slate-400" id="totalRegistros">0 registros</span>
            </div>
            <div class="overflow-x-auto">
                <table class="tabla" id="tablaClientes">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Teléfono</th>
                            <th>Email</th>
                            <th>RUT</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla">
                        <tr><td colspan="6" class="text-center text-slate-500 py-6">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalCliente">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitulo">📋 Nuevo Cliente</h3>
                <button class="modal-close" onclick="cerrarModal()">&times;</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Nombre *</label>
                    <input type="text" id="nombreCliente" class="input-dark w-full" placeholder="Nombre completo" />
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Teléfono *</label>
                    <input type="text" id="telefonoCliente" class="input-dark w-full" placeholder="+56 9 1234 5678" />
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Email</label>
                    <input type="email" id="emailCliente" class="input-dark w-full" placeholder="correo@ejemplo.cl" />
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">RUT</label>
                    <input type="text" id="rutCliente" class="input-dark w-full" placeholder="12.345.678-9" />
                </div>
            </div>
            <input type="hidden" id="editId" value="" />
            <div class="flex flex-wrap gap-3 mt-6">
                <button onclick="guardarCliente()" class="btn-success flex-1">💾 Guardar</button>
                <button onclick="cerrarModal()" class="btn-primary" style="background:#64748b;">❌ Cancelar</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN DE SUPABASE
        // ============================================
        const SUPABASE_URL = 'https://fjsbinbakqxgsjrleqgi.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_bFsHSyyAVDKS_yPggL076A_qL4zWw_A';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ============================================
        // VERIFICAR SESIÓN
        // ============================================
        function verificarSesion() {
            if (localStorage.getItem('nevvy_session') !== 'true') {
                window.location.href = 'login.html';
            }
        }
        verificarSesion();

        function cerrarSesion() {
            localStorage.removeItem('nevvy_session');
        }

        // ============================================
        // RELOJ
        // ============================================
        function actualizarReloj() {
            const ahora = new Date();
            document.getElementById('fechaHora').textContent = 
                ahora.toLocaleDateString('es-CL') + ' ' + ahora.toLocaleTimeString('es-CL');
            setTimeout(actualizarReloj, 1000);
        }
        actualizarReloj();

        // ============================================
        // MODAL
        // ============================================
        function abrirModal(cliente = null) {
            document.getElementById('modalCliente').style.display = 'flex';
            if (cliente) {
                document.getElementById('modalTitulo').textContent = '✏️ Editar Cliente';
                document.getElementById('nombreCliente').value = cliente.nombre || '';
                document.getElementById('telefonoCliente').value = cliente.telefono || '';
                document.getElementById('emailCliente').value = cliente.email || '';
                document.getElementById('rutCliente').value = cliente.rut || '';
                document.getElementById('editId').value = cliente.id;
            } else {
                document.getElementById('modalTitulo').textContent = '📋 Nuevo Cliente';
                document.getElementById('nombreCliente').value = '';
                document.getElementById('telefonoCliente').value = '';
                document.getElementById('emailCliente').value = '';
                document.getElementById('rutCliente').value = '';
                document.getElementById('editId').value = '';
            }
        }

        function cerrarModal() {
            document.getElementById('modalCliente').style.display = 'none';
        }

        // ============================================
        // GUARDAR CLIENTE (CREAR O ACTUALIZAR)
        // ============================================
        async function guardarCliente() {
            const nombre = document.getElementById('nombreCliente').value.trim();
            const telefono = document.getElementById('telefonoCliente').value.trim();
            const email = document.getElementById('emailCliente').value.trim();
            const rut = document.getElementById('rutCliente').value.trim();
            const editId = document.getElementById('editId').value;

            if (!nombre || !telefono) {
                alert('❌ Completa los campos obligatorios: Nombre y Teléfono');
                return;
            }

            try {
                const data = { nombre, telefono, email, rut };

                if (editId) {
                    // Actualizar
                    const { error } = await supabaseClient
                        .from('clientes')
                        .update(data)
                        .eq('id', editId);

                    if (error) throw new Error(error.message);
                    alert('✅ Cliente actualizado correctamente');
                } else {
                    // Crear
                    const { error } = await supabaseClient
                        .from('clientes')
                        .insert([data]);

                    if (error) throw new Error(error.message);
                    alert('✅ Cliente guardado correctamente');
                }

                cerrarModal();
                cargarClientes();

            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        // ============================================
        // CARGAR CLIENTES
        // ============================================
        async function cargarClientes() {
            const { data: clientes, error } = await supabaseClient
                .from('clientes')
                .select('*')
                .order('id', { ascending: false })
                .limit(50);

            if (error) {
                alert('❌ Error al cargar clientes: ' + error.message);
                return;
            }

            const tbody = document.getElementById('cuerpoTabla');
            if (clientes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="text-center text-slate-500 py-6">No hay clientes registrados</td></tr>';
                document.getElementById('totalRegistros').textContent = '0 registros';
                return;
            }

            tbody.innerHTML = clientes.map(c => `
                <tr>
                    <td>${c.id}</td>
                    <td>${c.nombre}</td>
                    <td>${c.telefono}</td>
                    <td>${c.email || '-'}</td>
                    <td>${c.rut || '-'}</td>
                    <td>
                        <button onclick="editarCliente('${c.id}')" class="btn-sm btn-edit" title="Editar">✏️</button>
                        <button onclick="eliminarCliente('${c.id}')" class="btn-sm btn-delete" title="Eliminar">🗑️</button>
                        <button onclick="enviarWhatsApp('${c.telefono}', '${c.nombre}')" class="btn-sm btn-whatsapp" title="WhatsApp">💬</button>
                    </td>
                </tr>
            `).join('');

            document.getElementById('totalRegistros').textContent = `${clientes.length} registros`;
        }

        // ============================================
        // EDITAR CLIENTE
        // ============================================
        async function editarCliente(id) {
            const { data: cliente, error } = await supabaseClient
                .from('clientes')
                .select('*')
                .eq('id', id)
                .single();

            if (error) {
                alert('❌ Error al cargar el cliente: ' + error.message);
                return;
            }

            abrirModal(cliente);
        }

        // ============================================
        // ELIMINAR CLIENTE
        // ============================================
        async function eliminarCliente(id) {
            if (!confirm('¿Eliminar este cliente?')) return;

            try {
                const { error } = await supabaseClient
                    .from('clientes')
                    .delete()
                    .eq('id', id);

                if (error) throw new Error(error.message);

                alert('✅ Cliente eliminado');
                cargarClientes();

            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        // ============================================
        // ENVIAR WHATSAPP
        // ============================================
        function enviarWhatsApp(telefono, nombre) {
            const mensaje = `Hola ${nombre}, somos NEVVY TECH. ¿Cómo podemos ayudarte?`;
            const url = `https://api.whatsapp.com/send?phone=${telefono.replace(/[^0-9]/g, '')}&text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }

        // ============================================
        // INICIAR
        // ============================================
        cargarClientes();
    </script>
</body>
</html>
