<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEVVY TECH · Ventas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #0a1628; color: #e2e8f0; }
        .sidebar { background: #0f1a2e; border-right: 1px solid rgba(255,255,255,0.06); width: 220px; height: 100vh; position: fixed; top: 0; left: 0; padding: 20px 0; overflow-y: auto; }
        .sidebar a { display: block; padding: 12px 20px; color: #94a3b8; transition: all 0.3s; text-decoration: none; border-radius: 8px; margin: 0 10px; }
        .sidebar a:hover, .sidebar a.active { background: rgba(59, 130, 246, 0.1); color: #60a5fa; }
        .main-content { margin-left: 220px; padding: 24px; }
        .card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 16px; padding: 20px; }
        .tabla { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .tabla th { text-align: left; padding: 10px 12px; background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.06); color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 0.7rem; }
        .tabla td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .tag { padding: 2px 10px; border-radius: 50px; font-size: 0.7rem; font-weight: 500; }
        .tag-pendiente { background: rgba(251,191,36,0.15); color: #fbbf24; }
        .tag-completada { background: rgba(74,222,128,0.15); color: #4ade80; }
        .tag-entregada { background: rgba(148,163,184,0.15); color: #94a3b8; }
        .tag-cancelada { background: rgba(248,113,113,0.15); color: #f87171; }
        .btn-primary { background: linear-gradient(135deg, #1a56db, #3b82f6); padding: 8px 16px; border-radius: 8px; color: white; font-weight: 600; border: none; cursor: pointer; transition: all 0.3s; }
        .btn-primary:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(59,130,246,0.3); }
        .btn-success { background: linear-gradient(135deg, #059669, #10b981); padding: 8px 16px; border-radius: 8px; color: white; font-weight: 600; border: none; cursor: pointer; transition: all 0.3s; }
        .btn-success:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(16,185,129,0.3); }
        .btn-danger { background: linear-gradient(135deg, #dc2626, #ef4444); padding: 8px 16px; border-radius: 8px; color: white; font-weight: 600; border: none; cursor: pointer; transition: all 0.3s; }
        .btn-danger:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(239,68,68,0.3); }
        .logo-text { font-size: 22px; font-weight: 900; color: white; padding: 0 20px; margin-bottom: 20px; }
        .logo-text span { color: #3b82f6; }
        .input-dark { background: #0f1a2e; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px; padding: 10px 14px; color: white; outline: none; transition: border-color 0.3s; width: 100%; box-sizing: border-box; }
        .input-dark:focus { border-color: #3b82f6; }
        .input-dark::placeholder { color: #475569; }
        .input-dark.file-input { padding: 8px 12px; cursor: pointer; }
        select.input-dark { appearance: none; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal { background: #1a2744; border-radius: 20px; padding: 40px; max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { font-size: 20px; font-weight: 700; color: white; }
        .modal-close { background: none; border: none; color: #94a3b8; font-size: 28px; cursor: pointer; transition: color 0.3s; }
        .modal-close:hover { color: white; }
        .btn-sm { padding: 4px 10px; font-size: 0.7rem; border-radius: 6px; border: none; cursor: pointer; transition: all 0.3s; }
        .btn-edit { background: rgba(59,130,246,0.2); color: #60a5fa; }
        .btn-edit:hover { background: rgba(59,130,246,0.4); }
        .btn-delete { background: rgba(239,68,68,0.2); color: #f87171; }
        .btn-delete:hover { background: rgba(239,68,68,0.4); }
        .btn-whatsapp { background: rgba(37,211,102,0.2); color: #4ade80; }
        .btn-whatsapp:hover { background: rgba(37,211,102,0.4); }
        .btn-view { background: rgba(59,130,246,0.2); color: #60a5fa; }
        .btn-view:hover { background: rgba(59,130,246,0.4); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } .main-content { margin-left: 0; } .sidebar { transform: translateX(-100%); transition: transform 0.3s; } .sidebar.open { transform: translateX(0); } }
        .menu-toggle { display: none; color: white; font-size: 24px; background: none; border: none; cursor: pointer; }
        @media (max-width: 600px) { .menu-toggle { display: block; } }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <div class="logo-text">NEVVY <span>TECH</span></div>
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="ventas.html" class="active">🛒 Ventas</a>
        <a href="clientes.html">👤 Clientes</a>
        <a href="cotizaciones.html">📄 Cotizaciones</a>
        <a href="login.html" onclick="cerrarSesion()" style="color:#f87171; margin-top: 20px;">🚪 Cerrar Sesión</a>
    </div>

    <!-- CONTENIDO -->
    <div class="main-content">
        <div class="flex flex-wrap justify-between items-center mb-6">
            <div class="flex items-center gap-3">
                <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
                <h2 class="text-2xl font-bold text-white">🛒 Gestión de Ventas</h2>
            </div>
            <span class="text-sm text-slate-400" id="fechaHora"></span>
        </div>

        <div class="flex flex-wrap gap-3 mb-6">
            <button onclick="abrirModal()" class="btn-success">➕ Nueva Venta</button>
            <button onclick="exportarReporte()" class="btn-primary">📊 Exportar Reporte</button>
        </div>

        <div class="card">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-semibold text-white">📋 Listado de Ventas</h3>
                <span class="text-xs text-slate-400" id="totalRegistros">0 registros</span>
            </div>
            <div class="overflow-x-auto">
                <table class="tabla" id="tablaVentas">
                    <thead>
                        <tr>
                            <th>N° Orden</th>
                            <th>Cliente</th>
                            <th>Producto</th>
                            <th>Monto</th>
                            <th>Estado</th>
                            <th>F. Emisión</th>
                            <th>Boleta</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla">
                        <tr><td colspan="8" class="text-center text-slate-500 py-6">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalVenta">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitulo">📋 Nueva Venta</h3>
                <button class="modal-close" onclick="cerrarModal()">&times;</button>
            </div>
            <form id="formVenta" onsubmit="guardarVenta(event)">
                <div class="grid-2">
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Cliente *</label>
                        <input type="text" id="clienteVenta" class="input-dark" placeholder="Nombre del cliente" required />
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Teléfono *</label>
                        <input type="text" id="telefonoVenta" class="input-dark" placeholder="+56 9 1234 5678" required />
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Producto/Servicio *</label>
                        <input type="text" id="productoVenta" class="input-dark" placeholder="Ej: Desarrollo de Software" required />
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Monto $ *</label>
                        <input type="number" id="montoVenta" class="input-dark" placeholder="150000" required />
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Fecha de Emisión *</label>
                        <input type="date" id="fechaEmision" class="input-dark" required />
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Forma de Pago</label>
                        <select id="pagoVenta" class="input-dark">
                            <option value="Efectivo">Efectivo</option>
                            <option value="Transferencia">Transferencia</option>
                            <option value="Débito">Débito</option>
                            <option value="Crédito">Crédito</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Estado</label>
                        <select id="estadoVenta" class="input-dark">
                            <option value="Pendiente">Pendiente</option>
                            <option value="Completada">Completada</option>
                            <option value="Entregada">Entregada</option>
                            <option value="Cancelada">Cancelada</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Boleta SII</label>
                        <input type="file" id="boletaInput" class="input-dark file-input" accept=".pdf,.jpg,.jpeg,.png" />
                        <input type="hidden" id="boletaBase64" value="" />
                        <div id="boletaPreview" class="mt-2 hidden">
                            <p class="text-xs text-green-400">✅ Archivo cargado</p>
                        </div>
                    </div>
                </div>
                <input type="hidden" id="editId" value="" />
                <div class="flex flex-wrap gap-3 mt-6">
                    <button type="submit" class="btn-success flex-1">💾 Guardar</button>
                    <button type="button" onclick="cerrarModal()" class="btn-primary" style="background:#64748b;">❌ Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL PARA VER BOLETA -->
    <div class="modal-overlay" id="modalBoleta">
        <div class="modal" style="max-width:500px;">
            <div class="modal-header">
                <h3 class="text-white">📄 Boleta SII</h3>
                <button class="modal-close" onclick="document.getElementById('modalBoleta').style.display='none'">&times;</button>
            </div>
            <div id="boletaContenido" class="text-center">
                <p class="text-slate-400">No hay boleta disponible</p>
            </div>
            <div class="mt-4">
                <button onclick="descargarBoleta()" class="btn-primary w-full">📥 Descargar Boleta</button>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN - API FLASK
        // ============================================
        const API_URL = 'https://nevvytech-api.onrender.com/api';

        // ============================================
        // VERIFICAR SESIÓN
        // ============================================
        function verificarSesion() {
            if (localStorage.getItem('nevvy_session') !== 'true') {
                window.location.href = 'login.html';
            }
        }
        verificarSesion();

        function cerrarSesion() {
            localStorage.removeItem('nevvy_session');
            window.location.href = 'login.html';
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // ============================================
        // RELOJ
        // ============================================
        function actualizarReloj() {
            const ahora = new Date();
            const fechaHora = document.getElementById('fechaHora');
            if (fechaHora) {
                fechaHora.textContent = ahora.toLocaleDateString('es-CL') + ' ' + ahora.toLocaleTimeString('es-CL');
            }
            setTimeout(actualizarReloj, 1000);
        }
        actualizarReloj();

        // ============================================
        // FECHA ACTUAL POR DEFECTO
        // ============================================
        function setFechaActual() {
            const hoy = new Date().toISOString().split('T')[0];
            const fechaInput = document.getElementById('fechaEmision');
            if (fechaInput && !fechaInput.value) {
                fechaInput.value = hoy;
            }
        }

        // ============================================
        // SUBIR BOLETA
        // ============================================
        document.getElementById('boletaInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const base64 = event.target.result;
                    document.getElementById('boletaBase64').value = base64;
                    const preview = document.getElementById('boletaPreview');
                    preview.classList.remove('hidden');
                    preview.innerHTML = `<p class="text-xs text-green-400">✅ Archivo cargado: ${file.name}</p>`;
                };
                reader.readAsDataURL(file);
            }
        });

        // ============================================
        // MODAL
        // ============================================
        function abrirModal(venta = null) {
            document.getElementById('modalVenta').style.display = 'flex';
            setFechaActual();
            
            if (venta) {
                document.getElementById('modalTitulo').textContent = '✏️ Editar Venta';
                document.getElementById('clienteVenta').value = venta.cliente_nombre || '';
                document.getElementById('telefonoVenta').value = venta.cliente_telefono || '';
                document.getElementById('productoVenta').value = venta.producto || '';
                document.getElementById('montoVenta').value = venta.monto || '';
                document.getElementById('fechaEmision').value = venta.fecha_emision || new Date().toISOString().split('T')[0];
                document.getElementById('estadoVenta').value = venta.estado || 'Pendiente';
                document.getElementById('pagoVenta').value = venta.forma_pago || 'Efectivo';
                document.getElementById('editId').value = venta.id;
                
                if (venta.boleta_sii) {
                    document.getElementById('boletaBase64').value = venta.boleta_sii;
                    const preview = document.getElementById('boletaPreview');
                    preview.classList.remove('hidden');
                    preview.innerHTML = `<p class="text-xs text-green-400">✅ Boleta cargada</p>`;
                }
            } else {
                document.getElementById('modalTitulo').textContent = '📋 Nueva Venta';
                document.getElementById('clienteVenta').value = '';
                document.getElementById('telefonoVenta').value = '';
                document.getElementById('productoVenta').value = '';
                document.getElementById('montoVenta').value = '';
                document.getElementById('estadoVenta').value = 'Pendiente';
                document.getElementById('pagoVenta').value = 'Efectivo';
                document.getElementById('editId').value = '';
                document.getElementById('boletaBase64').value = '';
                document.getElementById('boletaPreview').classList.add('hidden');
                document.getElementById('boletaInput').value = '';
                setFechaActual();
            }
        }

        function cerrarModal() {
            document.getElementById('modalVenta').style.display = 'none';
        }

        // ============================================
        // GUARDAR VENTA
        // ============================================
        async function guardarVenta(event) {
            event.preventDefault();
            
            const cliente = document.getElementById('clienteVenta').value.trim();
            const telefono = document.getElementById('telefonoVenta').value.trim();
            const producto = document.getElementById('productoVenta').value.trim();
            const monto = parseFloat(document.getElementById('montoVenta').value);
            const estado = document.getElementById('estadoVenta').value;
            const pago = document.getElementById('pagoVenta').value;
            const fecha_emision = document.getElementById('fechaEmision').value;
            const boleta_sii = document.getElementById('boletaBase64').value;
            const editId = document.getElementById('editId').value;

            if (!cliente || !producto || !monto || !fecha_emision) {
                alert('❌ Completa los campos obligatorios');
                return;
            }

            try {
                const url = editId ? `${API_URL}/ventas/${editId}` : `${API_URL}/ventas`;
                const method = editId ? 'PUT' : 'POST';
                
                const response = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cliente: cliente,
                        telefono: telefono,
                        producto: producto,
                        monto: monto,
                        estado: estado,
                        forma_pago: pago,
                        fecha_emision: fecha_emision,
                        boleta_sii: boleta_sii
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert(editId ? '✅ Venta actualizada' : '✅ Venta guardada');
                    cerrarModal();
                    cargarVentas();
                } else {
                    alert('❌ Error: ' + data.message);
                }
            } catch (error) {
                alert('❌ Error de conexión: ' + error.message);
            }
        }

        // ============================================
        // CARGAR VENTAS
        // ============================================
        async function cargarVentas() {
            try {
                const response = await fetch(`${API_URL}/ventas`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                
                const tbody = document.getElementById('cuerpoTabla');
                const totalRegistros = document.getElementById('totalRegistros');
                
                if (!data.data || data.data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="8" class="text-center text-slate-500 py-6">No hay ventas registradas</td></tr>';
                    if (totalRegistros) totalRegistros.textContent = '0 registros';
                    return;
                }

                const estadoClass = {
                    'Pendiente': 'tag-pendiente',
                    'Completada': 'tag-completada',
                    'Entregada': 'tag-entregada',
                    'Cancelada': 'tag-cancelada'
                };

                tbody.innerHTML = data.data.map(v => `
                    <tr>
                        <td><span class="text-xs font-mono text-white">${v.numero_orden}</span></td>
                        <td>${v.cliente_nombre || 'N/A'}</td>
                        <td>${v.producto}</td>
                        <td><span class="text-green-400 font-medium">$${v.monto.toLocaleString('es-CL')}</span></td>
                        <td><span class="tag ${estadoClass[v.estado] || 'tag-pendiente'}">${v.estado}</span></td>
                        <td class="text-xs text-slate-400">${v.fecha_emision ? new Date(v.fecha_emision).toLocaleDateString('es-CL') : '-'}</td>
                        <td>
                            ${v.boleta_sii ? `<button onclick="verBoleta('${v.boleta_sii}')" class="btn-sm btn-view" title="Ver Boleta">📄</button>` : '-'}
                        </td>
                        <td>
                            <button onclick="editarVenta(${v.id})" class="btn-sm btn-edit" title="Editar">✏️</button>
                            <button onclick="eliminarVenta(${v.id})" class="btn-sm btn-delete" title="Eliminar">🗑️</button>
                            <button onclick="enviarWhatsApp('${v.cliente_nombre || ''}', '${v.numero_orden}', ${v.monto})" class="btn-sm btn-whatsapp" title="WhatsApp">💬</button>
                        </td>
                    </tr>
                `).join('');

                if (totalRegistros) totalRegistros.textContent = `${data.data.length} registros`;
            } catch (error) {
                console.error('Error al cargar ventas:', error);
                const tbody = document.getElementById('cuerpoTabla');
                if (tbody) {
                    tbody.innerHTML = `<tr><td colspan="8" class="text-center text-red-400 py-6">Error al cargar ventas: ${error.message}</td></tr>`;
                }
            }
        }

        // ============================================
        // VER BOLETA
        // ============================================
        let boletaActual = '';

        function verBoleta(base64) {
            boletaActual = base64;
            const modal = document.getElementById('modalBoleta');
            const contenido = document.getElementById('boletaContenido');
            
            if (base64 && base64.startsWith('data:application/pdf')) {
                contenido.innerHTML = `<embed src="${base64}" type="application/pdf" width="100%" height="400px" />`;
            } else if (base64 && base64.startsWith('data:image')) {
                contenido.innerHTML = `<img src="${base64}" style="max-width:100%; max-height:400px; border-radius:8px;" />`;
            } else {
                contenido.innerHTML = '<p class="text-slate-400">No se puede previsualizar este archivo</p>';
            }
            
            modal.style.display = 'flex';
        }

        function descargarBoleta() {
            if (boletaActual) {
                const link = document.createElement('a');
                link.href = boletaActual;
                link.download = `boleta_${Date.now()}`;
                link.click();
            }
        }

        // ============================================
        // EDITAR VENTA
        // ============================================
        async function editarVenta(id) {
            try {
                const response = await fetch(`${API_URL}/ventas/${id}`);
                const data = await response.json();
                
                if (data.success) {
                    abrirModal(data.data);
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        // ============================================
        // ELIMINAR VENTA
        // ============================================
        async function eliminarVenta(id) {
            if (!confirm('¿Eliminar esta venta?')) return;

            try {
                const response = await fetch(`${API_URL}/ventas/${id}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (data.success) {
                    alert('✅ Venta eliminada');
                    cargarVentas();
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        // ============================================
        // WHATSAPP
        // ============================================
        function enviarWhatsApp(cliente, numero, total) {
            const mensaje = `Hola ${cliente}, tu orden ${numero} está lista. Total: $${total.toLocaleString('es-CL')}. ¡Gracias!`;
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }

        // ============================================
        // EXPORTAR REPORTE
        // ============================================
        async function exportarReporte() {
            try {
                const response = await fetch(`${API_URL}/ventas`);
                const data = await response.json();
                
                if (!data.data || data.data.length === 0) {
                    alert('❌ No hay ventas para exportar');
                    return;
                }

                let texto = 'REPORTE DE VENTAS\n';
                texto += '='.repeat(60) + '\n';
                texto += `Generado: ${new Date().toLocaleString('es-CL')}\n\n`;
                texto += 'N° Orden | Cliente | Producto | Total | Estado | Fecha Emisión\n';
                texto += '-'.repeat(70) + '\n';
                
                data.data.forEach(v => {
                    const fechaEmision = v.fecha_emision ? new Date(v.fecha_emision).toLocaleDateString('es-CL') : '-';
                    texto += `${v.numero_orden} | ${v.cliente_nombre || 'N/A'} | ${v.producto} | $${v.monto} | ${v.estado} | ${fechaEmision}\n`;
                });
                
                const total = data.data.reduce((sum, v) => sum + v.monto, 0);
                texto += '\n' + '='.repeat(60) + '\n';
                texto += `TOTAL INGRESOS: $${total.toLocaleString('es-CL')}\n`;
                
                const blob = new Blob([texto], { type: 'text/plain;charset=utf-8' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `reporte_ventas_${new Date().toISOString().slice(0,10)}.txt`;
                link.click();
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        // ============================================
        // INICIAR
        // ============================================
        cargarVentas();
    </script>
