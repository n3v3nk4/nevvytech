<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEVVY TECH · Cotizaciones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #0a1628; color: #e2e8f0; }
        .sidebar {
            background: #0f1a2e;
            border-right: 1px solid rgba(255,255,255,0.06);
            width: 220px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding: 20px 0;
        }
        .sidebar a {
            display: block;
            padding: 12px 20px;
            color: #94a3b8;
            transition: all 0.3s;
            text-decoration: none;
            border-radius: 8px;
            margin: 0 10px;
        }
        .sidebar a:hover { background: rgba(59, 130, 246, 0.1); color: #60a5fa; }
        .main-content { margin-left: 220px; padding: 24px; }
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 20px;
        }
        .tabla { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .tabla th { text-align: left; padding: 10px 12px; background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.06); color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 0.7rem; }
        .tabla td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .tag { padding: 2px 10px; border-radius: 50px; font-size: 0.7rem; font-weight: 500; }
        .tag-pendiente { background: rgba(251,191,36,0.15); color: #fbbf24; }
        .tag-enviada { background: rgba(59,130,246,0.15); color: #60a5fa; }
        .tag-aceptada { background: rgba(74,222,128,0.15); color: #4ade80; }
        .tag-rechazada { background: rgba(248,113,113,0.15); color: #f87171; }
        .btn-success {
            background: linear-gradient(135deg, #059669, #10b981);
            padding: 8px 16px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-success:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(16,185,129,0.3); }
        .btn-primary {
            background: linear-gradient(135deg, #1a56db, #3b82f6);
            padding: 8px 16px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(59,130,246,0.3); }
        .btn-warning {
            background: linear-gradient(135deg, #d97706, #f59e0b);
            padding: 8px 16px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-warning:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(245,158,11,0.3); }
        .logo-text { font-size: 22px; font-weight: 900; color: white; padding: 0 20px; margin-bottom: 20px; }
        .logo-text span { color: #3b82f6; }
        .input-dark {
            background: #0f1a2e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px 14px;
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-dark:focus { border-color: #3b82f6; }
        .input-dark::placeholder { color: #475569; }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo-text">NEVVY <span>TECH</span></div>
        <a href="dashboard.html">📊 Dashboard</a>
        <a href="ventas.html">🛒 Ventas</a>
        <a href="clientes.html">👤 Clientes</a>
        <a href="cotizaciones.html" class="active">📄 Cotizaciones</a>
        <a href="login.html" onclick="cerrarSesion()" style="color:#f87171; margin-top: 20px;">🚪 Cerrar Sesión</a>
    </div>

    <!-- CONTENIDO -->
    <div class="main-content">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-white">📄 Gestión de Cotizaciones</h2>
            <span class="text-sm text-slate-400" id="fechaHora"></span>
        </div>

        <!-- Botones -->
        <div class="flex gap-3 mb-6">
            <button onclick="mostrarFormulario()" class="btn-warning">➕ Nueva Cotización</button>
            <button onclick="exportarReporte()" class="btn-primary">📊 Exportar Reporte</button>
        </div>

        <!-- Formulario de nueva cotización -->
        <div id="formCotizacion" class="card hidden mb-6">
            <h3 class="text-sm font-semibold text-white mb-4">📋 Nueva Cotización</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Cliente *</label>
                    <input type="text" id="clienteCot" class="input-dark w-full" placeholder="Nombre del cliente" />
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Teléfono *</label>
                    <input type="text" id="telefonoCot" class="input-dark w-full" placeholder="+56 9 1234 5678" />
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Servicios *</label>
                    <input type="text" id="serviciosCot" class="input-dark w-full" placeholder="Ej: Desarrollo Web, App Móvil" />
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Monto Total $ *</label>
                    <input type="number" id="montoCot" class="input-dark w-full" placeholder="150000" />
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Estado</label>
                    <select id="estadoCot" class="input-dark w-full">
                        <option value="pendiente">Pendiente</option>
                        <option value="enviada">Enviada</option>
                        <option value="aceptada">Aceptada</option>
                        <option value="rechazada">Rechazada</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-3 mt-4">
                <button onclick="guardarCotizacion()" class="btn-warning">💾 Guardar Cotización</button>
                <button onclick="ocultarFormulario()" class="btn-primary" style="background:#64748b;">❌ Cancelar</button>
            </div>
        </div>

        <!-- Tabla -->
        <div class="card">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-semibold text-white">📋 Listado de Cotizaciones</h3>
                <span class="text-xs text-slate-400" id="totalRegistros">0 registros</span>
            </div>
            <div class="overflow-x-auto">
                <table class="tabla" id="tablaCotizaciones">
                    <thead>
                        <tr>
                            <th>N° Cotización</th>
                            <th>Cliente</th>
                            <th>Servicios</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th>Fecha</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla">
                        <tr><td colspan="7" class="text-center text-slate-500 py-6">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // VERIFICAR SESIÓN
        // ============================================
        function verificarSesion() {
            if (localStorage.getItem('nevvy_session') !== 'true') {
                window.location.href = 'login.html';
            }
        }
        verificarSesion();

        function cerrarSesion() {
            localStorage.removeItem('nevvy_session');
        }

        // ============================================
        // RELOJ
        // ============================================
        function actualizarReloj() {
            const ahora = new Date();
            document.getElementById('fechaHora').textContent = 
                ahora.toLocaleDateString('es-CL') + ' ' + ahora.toLocaleTimeString('es-CL');
            setTimeout(actualizarReloj, 1000);
        }
        actualizarReloj();

        // ============================================
        // DATOS DE EJEMPLO
        // ============================================
        let cotizaciones = [
            { numero: 'COT-2026-001', cliente: 'Juan Pérez', servicios: 'Desarrollo Web, App Móvil', total: 250000, estado: 'enviada', fecha: '25/07/2026' },
            { numero: 'COT-2026-002', cliente: 'María González', servicios: 'Sitio Web', total: 80000, estado: 'pendiente', fecha: '24/07/2026' },
            { numero: 'COT-2026-003', cliente: 'Carlos López', servicios: 'Automatización + IA', total: 180000, estado: 'aceptada', fecha: '23/07/2026' },
        ];

        // ============================================
        // MOSTRAR/OCULTAR FORMULARIO
        // ============================================
        function mostrarFormulario() {
            document.getElementById('formCotizacion').classList.remove('hidden');
        }

        function ocultarFormulario() {
            document.getElementById('formCotizacion').classList.add('hidden');
            document.getElementById('clienteCot').value = '';
            document.getElementById('telefonoCot').value = '';
            document.getElementById('serviciosCot').value = '';
            document.getElementById('montoCot').value = '';
        }

        // ============================================
        // GUARDAR COTIZACIÓN
        // ============================================
        function guardarCotizacion() {
            const cliente = document.getElementById('clienteCot').value.trim();
            const telefono = document.getElementById('telefonoCot').value.trim();
            const servicios = document.getElementById('serviciosCot').value.trim();
            const monto = parseFloat(document.getElementById('montoCot').value);
            const estado = document.getElementById('estadoCot').value;

            if (!cliente || !telefono || !servicios || !monto) {
                alert('❌ Completa todos los campos obligatorios');
                return;
            }

            cotizaciones.push({
                numero: `COT-2026-${String(cotizaciones.length + 1).padStart(3, '0')}`,
                cliente: cliente,
                servicios: servicios,
                total: monto,
                estado: estado,
                fecha: new Date().toLocaleDateString('es-CL')
            });

            cargarCotizaciones();
            ocultarFormulario();
            alert('✅ Cotización guardada correctamente');
        }

        // ============================================
        // CARGAR TABLA
        // ============================================
        function cargarCotizaciones() {
            const tbody = document.getElementById('cuerpoTabla');
            const estadoClass = {
                'pendiente': 'tag-pendiente',
                'enviada': 'tag-enviada',
                'aceptada': 'tag-aceptada',
                'rechazada': 'tag-rechazada'
            };
            const estadoTexto = {
                'pendiente': 'Pendiente',
                'enviada': 'Enviada',
                'aceptada': 'Aceptada',
                'rechazada': 'Rechazada'
            };

            if (cotizaciones.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="text-center text-slate-500 py-6">No hay cotizaciones</td></tr>';
                return;
            }

            tbody.innerHTML = cotizaciones.map((c, i) => `
                <tr>
                    <td><span class="text-xs font-mono text-white">${c.numero}</span></td>
                    <td>${c.cliente}</td>
                    <td>${c.servicios}</td>
                    <td><span class="text-green-400 font-medium">$${c.total.toLocaleString('es-CL')}</span></td>
                    <td><span class="tag ${estadoClass[c.estado] || 'tag-pendiente'}">${estadoTexto[c.estado] || c.estado}</span></td>
                    <td class="text-xs text-slate-400">${c.fecha}</td>
                    <td>
                        <button onclick="enviarWhatsApp('${c.cliente}', '${c.numero}', ${c.total})" class="text-green-400 hover:text-green-300 text-sm">💬</button>
                        <button onclick="eliminarCotizacion(${i})" class="text-red-400 hover:text-red-300 text-sm">🗑️</button>
                    </td>
                </tr>
            `).join('');

            document.getElementById('totalRegistros').textContent = `${cotizaciones.length} registros`;
        }

        // ============================================
        // ENVIAR POR WHATSAPP
        // ============================================
        function enviarWhatsApp(cliente, numero, total) {
            const mensaje = `Hola ${cliente}, te enviamos la cotización ${numero} por un total de $${total.toLocaleString('es-CL')}. ¿Te parece bien? ¡Quedamos atentos!`;
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        }

        // ============================================
        // ELIMINAR
        // ============================================
        function eliminarCotizacion(index) {
            if (confirm('¿Eliminar esta cotización?')) {
                cotizaciones.splice(index, 1);
                cargarCotizaciones();
            }
        }

        // ============================================
        // EXPORTAR REPORTE
        // ============================================
        function exportarReporte() {
            let texto = 'REPORTE DE COTIZACIONES\n';
            texto += '='.repeat(50) + '\n';
            texto += `Generado: ${new Date().toLocaleString('es-CL')}\n\n`;
            
            cotizaciones.forEach(c => {
                texto += `${c.numero} | ${c.cliente} | ${c.servicios} | $${c.total} | ${c.estado} | ${c.fecha}\n`;
            });
            
            const blob = new Blob([texto], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `reporte_cotizaciones_${new Date().toISOString().slice(0,10)}.txt`;
            link.click();
        }

        // ============================================
        // INICIAR
        // ============================================
        cargarCotizaciones();
    </script>
</body>
</html>
