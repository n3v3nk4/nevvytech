<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEVVY TECH · Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #0a1628; color: #e2e8f0; }
        .sidebar {
            background: #0f1a2e;
            border-right: 1px solid rgba(255,255,255,0.06);
            width: 220px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding: 20px 0;
        }
        .sidebar a {
            display: block;
            padding: 12px 20px;
            color: #94a3b8;
            transition: all 0.3s;
            text-decoration: none;
            border-radius: 8px;
            margin: 0 10px;
        }
        .sidebar a:hover, .sidebar a.active {
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
        }
        .main-content { margin-left: 220px; padding: 24px; }
        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 20px;
        }
        .stat-value { font-size: 28px; font-weight: 700; color: #60a5fa; }
        .stat-value.green { color: #4ade80; }
        .stat-value.yellow { color: #fbbf24; }
        .stat-value.purple { color: #a78bfa; }
        .card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 20px;
        }
        .tabla { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        .tabla th { text-align: left; padding: 10px 12px; background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.06); color: #94a3b8; font-weight: 600; text-transform: uppercase; font-size: 0.7rem; }
        .tabla td { padding: 10px 12px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .tag { padding: 2px 10px; border-radius: 50px; font-size: 0.7rem; font-weight: 500; }
        .tag-pendiente { background: rgba(251,191,36,0.15); color: #fbbf24; }
        .tag-completada { background: rgba(74,222,128,0.15); color: #4ade80; }
        .tag-entregada { background: rgba(148,163,184,0.15); color: #94a3b8; }
        .tag-cancelada { background: rgba(248,113,113,0.15); color: #f87171; }
        .logo-text { font-size: 22px; font-weight: 900; color: white; padding: 0 20px; margin-bottom: 20px; }
        .logo-text span { color: #3b82f6; }
        .btn-primary {
            background: linear-gradient(135deg, #1a56db, #3b82f6);
            padding: 8px 16px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(59,130,246,0.3); }
        .btn-success {
            background: linear-gradient(135deg, #059669, #10b981);
            padding: 8px 16px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-success:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(16,185,129,0.3); }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo-text">NEVVY <span>TECH</span></div>
        <a href="dashboard.html" class="active">📊 Dashboard</a>
        <a href="ventas.html">🛒 Ventas</a>
        <a href="clientes.html">👤 Clientes</a>
        <a href="cotizaciones.html">📄 Cotizaciones</a>
        <a href="login.html" onclick="cerrarSesion()" style="color:#f87171; margin-top: 20px;">🚪 Cerrar Sesión</a>
    </div>

    <!-- CONTENIDO -->
    <div class="main-content">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-white">📊 Dashboard</h2>
            <span class="text-sm text-slate-400" id="fechaHora"></span>
        </div>

        <!-- ESTADÍSTICAS -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="stat-card">
                <p class="text-xs text-slate-400">Total Ventas</p>
                <p class="stat-value green" id="totalVentas">0</p>
            </div>
            <div class="stat-card">
                <p class="text-xs text-slate-400">Clientes</p>
                <p class="stat-value" id="totalClientes">0</p>
            </div>
            <div class="stat-card">
                <p class="text-xs text-slate-400">Cotizaciones</p>
                <p class="stat-value yellow" id="totalCotizaciones">0</p>
            </div>
            <div class="stat-card">
                <p class="text-xs text-slate-400">Ingresos</p>
                <p class="stat-value green" id="totalIngresos">$0</p>
            </div>
        </div>

        <!-- ÚLTIMAS VENTAS -->
        <div class="card">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-semibold text-white">📋 Últimas Ventas</h3>
                <span class="text-xs text-slate-400" id="totalRegistros">0 registros</span>
            </div>
            <div class="overflow-x-auto">
                <table class="tabla" id="tablaVentas">
                    <thead>
                        <tr>
                            <th>N° Orden</th>
                            <th>Cliente</th>
                            <th>Total</th>
                            <th>Estado</th>
                            <th>Fecha</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla">
                        <tr><td colspan="5" class="text-center text-slate-500 py-6">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // CONFIGURACIÓN DE SUPABASE
        // ============================================
        const SUPABASE_URL = 'https://fjsbinbakqxgsjrleqgi.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_bFsHSyyAVDKS_yPggL076A_qL4zWw_A';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // ============================================
        // VERIFICAR SESIÓN
        // ============================================
        function verificarSesion() {
            const session = localStorage.getItem('nevvy_session');
            if (session !== 'true') {
                window.location.href = 'login.html';
            }
        }
        verificarSesion();

        // ============================================
        // CERRAR SESIÓN
        // ============================================
        function cerrarSesion() {
            localStorage.removeItem('nevvy_session');
            localStorage.removeItem('nevvy_usuario');
        }

        // ============================================
        // RELOJ
        // ============================================
        function actualizarReloj() {
            const ahora = new Date();
            document.getElementById('fechaHora').textContent = 
                ahora.toLocaleDateString('es-CL') + ' ' + ahora.toLocaleTimeString('es-CL');
            setTimeout(actualizarReloj, 1000);
        }
        actualizarReloj();

        // ============================================
        // CARGAR DASHBOARD DESDE SUPABASE
        // ============================================
        async function cargarDashboard() {
            try {
                // 1. Contar ventas
                const { count: totalVentas, error: errorVentas } = await supabaseClient
                    .from('ventas')
                    .select('*', { count: 'exact', head: true });

                if (errorVentas) throw new Error(errorVentas.message);

                // 2. Contar clientes
                const { count: totalClientes, error: errorClientes } = await supabaseClient
                    .from('clientes')
                    .select('*', { count: 'exact', head: true });

                if (errorClientes) throw new Error(errorClientes.message);

                // 3. Contar cotizaciones
                const { count: totalCotizaciones, error: errorCotizaciones } = await supabaseClient
                    .from('cotizaciones')
                    .select('*', { count: 'exact', head: true });

                if (errorCotizaciones) throw new Error(errorCotizaciones.message);

                // 4. Calcular ingresos totales
                const { data: ventasData, error: errorIngresos } = await supabaseClient
                    .from('ventas')
                    .select('monto');

                if (errorIngresos) throw new Error(errorIngresos.message);

                const totalIngresos = ventasData.reduce((sum, v) => sum + v.monto, 0);

                // 5. Actualizar estadísticas
                document.getElementById('totalVentas').textContent = totalVentas || 0;
                document.getElementById('totalClientes').textContent = totalClientes || 0;
                document.getElementById('totalCotizaciones').textContent = totalCotizaciones || 0;
                document.getElementById('totalIngresos').textContent = `$${totalIngresos.toLocaleString('es-CL')}`;

                // 6. Cargar últimas ventas
                await cargarUltimasVentas();

            } catch (error) {
                console.error('Error al cargar dashboard:', error);
                document.getElementById('cuerpoTabla').innerHTML = 
                    '<tr><td colspan="5" class="text-center text-red-400 py-6">Error al cargar datos</td></tr>';
            }
        }

        // ============================================
        // CARGAR ÚLTIMAS VENTAS
        // ============================================
        async function cargarUltimasVentas() {
            const { data: ventas, error } = await supabaseClient
                .from('ventas')
                .select('*, clientes(nombre)')
                .order('fecha', { ascending: false })
                .limit(10);

            if (error) {
                throw new Error(error.message);
            }

            const tbody = document.getElementById('cuerpoTabla');

            if (!ventas || ventas.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="text-center text-slate-500 py-6">No hay ventas registradas</td></tr>';
                document.getElementById('totalRegistros').textContent = '0 registros';
                return;
            }

            const estadoClass = {
                'Pendiente': 'tag-pendiente',
                'Completada': 'tag-completada',
                'Entregada': 'tag-entregada',
                'Cancelada': 'tag-cancelada'
            };

            tbody.innerHTML = ventas.map(v => `
                <tr>
                    <td><span class="text-xs font-mono text-white">${v.numero_orden}</span></td>
                    <td>${v.clientes?.nombre || 'N/A'}</td>
                    <td><span class="text-green-400 font-medium">$${v.monto.toLocaleString('es-CL')}</span></td>
                    <td><span class="tag ${estadoClass[v.estado] || 'tag-pendiente'}">${v.estado || 'Pendiente'}</span></td>
                    <td class="text-xs text-slate-400">${new Date(v.fecha).toLocaleDateString('es-CL')}</td>
                </tr>
            `).join('');

            document.getElementById('totalRegistros').textContent = `${ventas.length} registros`;
        }

        // ============================================
        // INICIAR
        // ============================================
        cargarDashboard();
    </script>
</body>
</html>
