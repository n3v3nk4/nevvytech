<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEVVY TECH · Panel de Administración</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { 
            background: #0a1628; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 20px;
            padding: 48px;
            max-width: 420px;
            width: 100%;
            backdrop-filter: blur(10px);
        }
        .input-dark {
            background: #0f1a2e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 12px 16px;
            color: white;
            width: 100%;
            outline: none;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        .input-dark:focus { border-color: #3b82f6; }
        .input-dark.error { border-color: #ef4444; }
        .btn-primary {
            background: linear-gradient(135deg, #1a56db, #3b82f6);
            padding: 12px 24px;
            border-radius: 10px;
            color: white;
            font-weight: 600;
            border: none;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            position: relative;
        }
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
        }
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        .logo-text { font-size: 28px; font-weight: 900; color: white; }
        .logo-text span { color: #3b82f6; }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .password-toggle {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            cursor: pointer;
            transition: color 0.3s;
        }
        .password-toggle:hover { color: #94a3b8; }
        .input-wrapper { position: relative; }
        .mensaje-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #f87171;
        }
        .mensaje-exito {
            background: rgba(52, 211, 153, 0.1);
            border: 1px solid rgba(52, 211, 153, 0.2);
            color: #34d399;
        }
        .mensaje-info {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }
        .version {
            position: fixed;
            bottom: 10px;
            right: 10px;
            color: #475569;
            font-size: 11px;
        }
    </style>
</head>
<body>
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="login-card">
            <div class="text-center mb-8">
                <h1 class="logo-text">NEVVY <span>TECH</span></h1>
                <p class="text-slate-400 text-sm mt-2">Panel de Administración</p>
                <div class="mt-4 inline-block px-3 py-1 bg-blue-500/10 border border-blue-500/20 rounded-full text-xs text-blue-400">
                    v2.0
                </div>
            </div>
            
            <div id="mensajeInfo" class="hidden px-4 py-3 rounded-lg mb-4 text-sm"></div>
            
            <form id="formLogin">
                <div class="mb-4">
                    <label class="block text-sm text-slate-400 mb-1">
                        <i class="fas fa-user mr-2"></i>Usuario
                    </label>
                    <input type="text" id="usuario" class="input-dark" placeholder="admin" value="admin" required />
                </div>
                <div class="mb-6">
                    <label class="block text-sm text-slate-400 mb-1">
                        <i class="fas fa-lock mr-2"></i>Contraseña
                    </label>
                    <div class="input-wrapper">
                        <input type="password" id="password" class="input-dark" placeholder="••••••••" value="nevvy2026" required />
                        <i class="fas fa-eye password-toggle" id="togglePassword" onclick="togglePassword()"></i>
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="btnLogin">
                    <span id="btnText">Ingresar</span>
                    <span id="btnSpinner" class="spinner" style="display:none;"></span>
                </button>
            </form>
            
            <p class="text-center text-slate-500 text-xs mt-4">
                Acceso restringido · NEVVY TECH © 2026
            </p>
        </div>
    </div>
    
    <div class="version">v2.0 · Login con API</div>

    <script>
        // ============================================
        // CONFIGURACIÓN
        // ============================================
        const API_URL = 'https://nevvytech-api.onrender.com/api';

        // ============================================
        // MOSTRAR MENSAJE
        // ============================================
        function mostrarMensaje(texto, tipo) {
            const div = document.getElementById('mensajeInfo');
            div.textContent = texto;
            div.className = 'px-4 py-3 rounded-lg mb-4 text-sm ';
            
            if (tipo === 'error') {
                div.className += 'mensaje-error';
            } else if (tipo === 'exito') {
                div.className += 'mensaje-exito';
            } else {
                div.className += 'mensaje-info';
            }
            
            div.classList.remove('hidden');
            setTimeout(() => div.classList.add('hidden'), 5000);
        }

        // ============================================
        // TOGGLE PASSWORD
        // ============================================
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('togglePassword');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }

        // ============================================
        // INICIAR SESIÓN
        // ============================================
        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value.trim();
            const btnLogin = document.getElementById('btnLogin');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            // Limpiar errores
            document.getElementById('usuario').classList.remove('error');
            document.getElementById('password').classList.remove('error');

            // Validar campos
            if (!usuario || !password) {
                mostrarMensaje('❌ Completa todos los campos', 'error');
                if (!usuario) document.getElementById('usuario').classList.add('error');
                if (!password) document.getElementById('password').classList.add('error');
                return;
            }

            // Mostrar loading
            btnLogin.disabled = true;
            btnText.style.display = 'none';
            btnSpinner.style.display = 'inline-block';
            mostrarMensaje('⏳ Verificando credenciales...', 'info');

            try {
                console.log('📤 Enviando login para:', usuario);
                
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        email: usuario, 
                        password: password 
                    })
                });

                console.log('📥 Status:', response.status);
                
                const data = await response.json();
                console.log('📊 Respuesta:', data);

                // Ocultar loading
                btnLogin.disabled = false;
                btnText.style.display = 'inline';
                btnSpinner.style.display = 'none';

                if (data.success && data.user) {
                    // Guardar sesión
                    localStorage.setItem('nevvy_session', 'true');
                    localStorage.setItem('nevvy_usuario', data.user.nombre || data.user.email);
                    localStorage.setItem('nevvy_user_email', data.user.email);
                    localStorage.setItem('nevvy_user_id', data.user.id);
                    localStorage.setItem('nevvy_user_rol', data.user.rol || 'usuario');

                    mostrarMensaje('✅ ¡Bienvenido ' + data.user.nombre + '!', 'exito');

                    // ✅ REDIRECCIÓN DIRECTA AL DASHBOARD (sin esperar)
                    console.log('🚀 Redirigiendo a dashboard.html');
                    window.location.href = '/dashboard.html';

                } else {
                    mostrarMensaje('❌ ' + (data.message || 'Usuario o contraseña incorrectos'), 'error');
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }

            } catch (error) {
                console.error('❌ Error:', error);
                btnLogin.disabled = false;
                btnText.style.display = 'inline';
                btnSpinner.style.display = 'none';
                
                mostrarMensaje('❌ Error de conexión con el servidor: ' + error.message, 'error');
            }
        });

        // ============================================
        // VERIFICAR SESIÓN AL CARGAR
        // ============================================
        (function verificarSesion() {
            if (localStorage.getItem('nevvy_session') === 'true') {
                console.log('🔐 Sesión activa, redirigiendo a dashboard');
                window.location.href = '/dashboard.html';
            }
        })();

        // ============================================
        // ENTER KEY
        // ============================================
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const active = document.activeElement;
                if (active.id === 'usuario' || active.id === 'password') {
                    document.getElementById('formLogin').dispatchEvent(new Event('submit'));
                }
            }
        });
    </script>
</body>
</html>
