<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard · NEVVY TECH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="/static/style.css" />
    <style>
        * { font-family: 'Inter', sans-serif; }
        body { background: #0a1628; color: #e2e8f0; }
        
        /* Sidebar */
        .sidebar {
            background: rgba(15, 26, 46, 0.95);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            width: 250px;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 50;
        }
        
        .sidebar-closed .sidebar {
            transform: translateX(-100%);
        }
        
        /* Main content */
        .main-content {
            margin-left: 250px;
            padding: 20px;
            min-height: 100vh;
            transition: margin-left 0.3s ease;
        }
        
        .sidebar-closed .main-content {
            margin-left: 0;
        }
        
        /* Cards */
        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 20px;
            transition: all 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-2px);
            border-color: rgba(59, 130, 246, 0.3);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }
        
        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }
        
        /* Tables */
        .table-container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            overflow: hidden;
        }
        
        .table-container table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .table-container th {
            text-align: left;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            color: #94a3b8;
            font-weight: 600;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .table-container td {
            padding: 12px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
        }
        
        .table-container tr:hover {
            background: rgba(255, 255, 255, 0.03);
        }
        
        /* Buttons */
        .btn-action {
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.2);
            color: #3b82f6;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s;
            cursor: pointer;
        }
        
        .btn-action:hover {
            background: rgba(59, 130, 246, 0.2);
            transform: scale(1.05);
        }
        
        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
        }
        
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.2);
        }
        
        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal-content {
            background: #0f1a2e;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 32px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        /* Inputs in modal */
        .modal-input {
            background: #0a1628;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            padding: 10px 14px;
            color: white;
            width: 100%;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .modal-input:focus {
            border-color: #3b82f6;
        }
        
        .modal-input::placeholder {
            color: #4a5568;
        }
        
        /* Status badges */
        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }
        
        .badge-pendiente { background: rgba(251, 191, 36, 0.2); color: #fbbf24; }
        .badge-pagado { background: rgba(52, 211, 153, 0.2); color: #34d399; }
        .badge-cancelado { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .badge-completado { background: rgba(59, 130, 246, 0.2); color: #3b82f6; }
        .badge-activo { background: rgba(52, 211, 153, 0.2); color: #34d399; }
        .badge-inactivo { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0a1628; }
        ::-webkit-scrollbar-thumb { background: #1a56db; border-radius: 3px; }
        
        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            
            .sidebar-open .sidebar {
                transform: translateX(0);
            }
            
            .main-content {
                margin-left: 0;
            }
            
            .sidebar-open .main-content {
                margin-left: 0;
            }
            
            .toggle-sidebar {
                display: inline-block !important;
            }
        }
        
        .toggle-sidebar {
            display: none;
        }
        
        .sidebar-link.active {
            background: rgba(59, 130, 246, 0.15);
            color: white;
            border-left: 3px solid #3b82f6;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- ============================================ -->
    <!-- SIDEBAR -->
    <!-- ============================================ -->
    <div class="sidebar" id="sidebar">
        <div class="p-6">
            <h1 class="text-2xl font-bold text-white mb-2">NEVVY <span class="text-blue-500">TECH</span></h1>
            <p class="text-slate-400 text-sm">Panel de Control</p>
        </div>
        
        <nav class="px-4 space-y-1">
            <a href="#" onclick="cargarSeccion('dashboard')" class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-300 hover:bg-white/5 hover:text-white transition-all sidebar-link active" data-section="dashboard">
                <i class="fas fa-th-large w-5"></i> Dashboard
            </a>
            <a href="#" onclick="cargarSeccion('ventas')" class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-300 hover:bg-white/5 hover:text-white transition-all sidebar-link" data-section="ventas">
                <i class="fas fa-shopping-cart w-5"></i> Ventas
            </a>
            <a href="#" onclick="cargarSeccion('clientes')" class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-300 hover:bg-white/5 hover:text-white transition-all sidebar-link" data-section="clientes">
                <i class="fas fa-users w-5"></i> Clientes
            </a>
            <a href="#" onclick="cargarSeccion('cotizaciones')" class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-300 hover:bg-white/5 hover:text-white transition-all sidebar-link" data-section="cotizaciones">
                <i class="fas fa-file-invoice w-5"></i> Cotizaciones
            </a>
        </nav>
        
        <div class="absolute bottom-0 left-0 right-0 p-6 border-t border-white/5">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold" id="userAvatar">A</div>
                <div>
                    <p class="text-white text-sm font-medium" id="userName">Administrador</p>
                    <p class="text-slate-400 text-xs" id="userEmail">admin@nevvytech.cl</p>
                </div>
            </div>
            <button onclick="cerrarSesion()" class="w-full mt-3 text-red-400 text-sm hover:text-red-300 transition-all flex items-center justify-center gap-2">
                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
            </button>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- MAIN CONTENT -->
    <!-- ============================================ -->
    <div class="main-content" id="mainContent">
        <!-- Header -->
        <div class="flex justify-between items-center mb-6">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="toggle-sidebar text-white text-2xl">
                    <i class="fas fa-bars"></i>
                </button>
                <h2 class="text-2xl font-bold text-white" id="sectionTitle">Dashboard</h2>
            </div>
            <div class="flex items-center gap-4">
                <span class="text-slate-400 text-sm hidden md:inline" id="currentDate"></span>
                <button onclick="recargarDatos()" class="text-slate-400 hover:text-white transition-all">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </div>

        <!-- CONTENIDO DINÁMICO -->
        <div id="contenidoDinamico">
            <div class="flex justify-center items-center h-64">
                <div class="loading-spinner"></div>
                <span class="ml-3 text-slate-400">Cargando...</span>
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- MODAL -->
    <!-- ============================================ -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-white" id="modalTitle">Nuevo Registro</h3>
                <button onclick="cerrarModal()" class="text-slate-400 hover:text-white text-2xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="modalMensaje" class="hidden mb-4 p-3 rounded-lg text-sm"></div>
            <form id="modalForm" onsubmit="return guardarRegistro(event)">
                <div id="modalCampos"></div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition-all mt-4">
                    Guardar
                </button>
            </form>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- SCRIPTS -->
    <!-- ============================================ -->
    <script>
        // ============================================
        // CONFIGURACIÓN API
        // ============================================
        const API_URL = '/api';

        // ============================================
        // VARIABLES GLOBALES
        // ============================================
        let seccionActual = 'dashboard';
        let modoEdicion = false;
        let idEdicion = null;
        let entidadActual = '';
        let datosActuales = [];

        // ============================================
        // INICIALIZACIÓN
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            // Verificar sesión
            if (!localStorage.getItem('nevvy_session')) {
                window.location.href = '/admin/login.html';
                return;
            }

            const nombre = localStorage.getItem('nevvy_usuario') || 'Administrador';
            const email = localStorage.getItem('nevvy_user_email') || 'admin@nevvytech.cl';
            
            document.getElementById('userName').textContent = nombre;
            document.getElementById('userEmail').textContent = email;
            document.getElementById('userAvatar').textContent = nombre.charAt(0).toUpperCase();

            const ahora = new Date();
            document.getElementById('currentDate').textContent = ahora.toLocaleDateString('es-CL', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });

            cargarSeccion('dashboard');
        });

        function toggleSidebar() {
            document.body.classList.toggle('sidebar-open');
        }

        function cargarSeccion(seccion) {
            seccionActual = seccion;
            
            document.querySelectorAll('.sidebar-link').forEach(el => el.classList.remove('active'));
            const link = document.querySelector(`.sidebar-link[data-section="${seccion}"]`);
            if (link) link.classList.add('active');

            const titulos = {
                dashboard: 'Dashboard',
                ventas: 'Ventas',
                clientes: 'Clientes',
                cotizaciones: 'Cotizaciones'
            };
            document.getElementById('sectionTitle').textContent = titulos[seccion] || seccion;

            switch(seccion) {
                case 'dashboard': cargarDashboard(); break;
                case 'ventas': cargarVentas(); break;
                case 'clientes': cargarClientes(); break;
                case 'cotizaciones': cargarCotizaciones(); break;
                default: cargarDashboard();
            }

            if (window.innerWidth <= 768) {
                document.body.classList.remove('sidebar-open');
            }
        }

        function recargarDatos() {
            cargarSeccion(seccionActual);
        }

        function cerrarSesion() {
            localStorage.removeItem('nevvy_session');
            localStorage.removeItem('nevvy_usuario');
            localStorage.removeItem('nevvy_user_email');
            window.location.href = '/admin/login.html';
        }

        async function apiFetch(endpoint, options = {}) {
            try {
                const response = await fetch(`${API_URL}${endpoint}`, {
                    headers: { 'Content-Type': 'application/json' },
                    ...options
                });
                return await response.json();
            } catch (error) {
                console.error('Error API:', error);
                return { success: false, message: 'Error de conexión' };
            }
        }

        // ============================================
        // DASHBOARD
        // ============================================
        async function cargarDashboard() {
            const container = document.getElementById('contenidoDinamico');
            
            try {
                const [ventasRes, clientesRes, cotizacionesRes] = await Promise.all([
                    fetch(`${API_URL}/ventas`),
                    fetch(`${API_URL}/clientes`),
                    fetch(`${API_URL}/cotizaciones`)
                ]);

                const ventasData = await ventasRes.json();
                const clientesData = await clientesRes.json();
                const cotizacionesData = await cotizacionesRes.json();

                const ventas = ventasData.data || [];
                const clientes = clientesData.data || [];
                const cotizaciones = cotizacionesData.data || [];

                const totalVentas = ventas.length;
                const totalClientes = clientes.length;
                const totalCotizaciones = cotizaciones.length;

                let montoTotal = 0;
                ventas.forEach(v => montoTotal += Number(v.monto) || 0);

                const ventasRecientes = ventas.slice(-5).reverse();

                container.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                        <div class="stat-card">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-slate-400 text-sm">Ventas</p>
                                    <p class="text-2xl font-bold text-white mt-1">${totalVentas}</p>
                                </div>
                                <div class="stat-icon bg-blue-500/20 text-blue-400">
                                    <i class="fas fa-shopping-cart"></i>
                                </div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-slate-400 text-sm">Clientes</p>
                                    <p class="text-2xl font-bold text-white mt-1">${totalClientes}</p>
                                </div>
                                <div class="stat-icon bg-green-500/20 text-green-400">
                                    <i class="fas fa-users"></i>
                                </div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-slate-400 text-sm">Cotizaciones</p>
                                    <p class="text-2xl font-bold text-white mt-1">${totalCotizaciones}</p>
                                </div>
                                <div class="stat-icon bg-yellow-500/20 text-yellow-400">
                                    <i class="fas fa-file-invoice"></i>
                                </div>
                            </div>
                        </div>
                        <div class="stat-card">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-slate-400 text-sm">Ingresos</p>
                                    <p class="text-2xl font-bold text-white mt-1">$${montoTotal.toLocaleString()}</p>
                                </div>
                                <div class="stat-icon bg-purple-500/20 text-purple-400">
                                    <i class="fas fa-dollar-sign"></i>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="table-container">
                        <div class="px-6 py-4 border-b border-white/5 flex justify-between items-center">
                            <h3 class="font-bold text-white">Últimas Ventas</h3>
                            <button onclick="cargarSeccion('ventas')" class="text-blue-400 text-sm hover:text-blue-300">
                                Ver todas <i class="fas fa-arrow-right ml-1"></i>
                            </button>
                        </div>
                        <div class="overflow-x-auto">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Nº Orden</th>
                                        <th>Cliente</th>
                                        <th>Producto</th>
                                        <th>Monto</th>
                                        <th>Estado</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${ventasRecientes.length === 0 ? `
                                        <tr>
                                            <td colspan="5" class="text-center text-slate-400 py-8">
                                                No hay ventas registradas
                                            </td>
                                        </tr>
                                    ` : ventasRecientes.map(v => `
                                        <tr>
                                            <td class="font-mono text-sm">${v.numero_orden || 'N/A'}</td>
                                            <td>${v.cliente_nombre || 'Sin cliente'}</td>
                                            <td>${v.producto || 'N/A'}</td>
                                            <td>$${Number(v.monto).toLocaleString()}</td>
                                            <td><span class="badge badge-${(v.estado || 'pendiente').toLowerCase()}">${v.estado || 'Pendiente'}</span></td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;

            } catch (error) {
                container.innerHTML = `
                    <div class="bg-red-500/10 border border-red-500/20 text-red-400 p-4 rounded-lg">
                        <i class="fas fa-exclamation-triangle mr-2"></i>
                        Error al cargar el dashboard: ${error.message}
                    </div>
                `;
            }
        }

        // ============================================
        // VENTAS (CON BOLETA Y FECHA DE EMISIÓN)
        // ============================================
        async function cargarVentas() {
            const container = document.getElementById('contenidoDinamico');
            
            try {
                const response = await fetch(`${API_URL}/ventas`);
                const data = await response.json();
                const ventas = data.data || [];

                container.innerHTML = `
                    <div class="flex justify-between items-center mb-6">
                        <div class="flex gap-2">
                            <input type="text" id="buscarVenta" placeholder="Buscar venta..." 
                                   class="bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-white text-sm focus:outline-none focus:border-blue-500">
                            <button onclick="buscarVentas()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                        <button onclick="abrirModal('ventas')" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm flex items-center gap-2">
                            <i class="fas fa-plus"></i> Nueva Venta
                        </button>
                    </div>
                    
                    <div class="table-container">
                        <div class="overflow-x-auto">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Nº Orden</th>
                                        <th>Cliente</th>
                                        <th>Producto</th>
                                        <th>Monto</th>
                                        <th>Forma Pago</th>
                                        <th>Estado</th>
                                        <th>F. Emisión</th>
                                        <th>Boleta SII</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaVentas">
                                    ${ventas.length === 0 ? `
                                        <tr>
                                            <td colspan="9" class="text-center text-slate-400 py-8">
                                                No hay ventas registradas
                                            </td>
                                        </tr>
                                    ` : ventas.map(v => `
                                        <tr>
                                            <td class="font-mono text-sm">${v.numero_orden || 'N/A'}</td>
                                            <td>${v.cliente_nombre || 'Sin cliente'}</td>
                                            <td>${v.producto || 'N/A'}</td>
                                            <td>$${Number(v.monto).toLocaleString()}</td>
                                            <td>${v.forma_pago || 'Efectivo'}</td>
                                            <td><span class="badge badge-${(v.estado || 'pendiente').toLowerCase()}">${v.estado || 'Pendiente'}</span></td>
                                            <td class="text-sm text-slate-400">${v.fecha_emision ? new Date(v.fecha_emision).toLocaleDateString() : 'N/A'}</td>
                                            <td class="text-sm text-slate-400">${v.boleta_sii || 'Sin boleta'}</td>
                                            <td>
                                                ${v.boleta_sii ? `<a href="/api/boletas/${v.boleta_sii}" target="_blank" class="btn-action">📄 Ver Boleta</a>` : 'Sin boleta'}
                                                <button onclick="editarRegistro('ventas', ${v.id})" class="btn-action mr-1">
                                                    <i class="fas fa-edit"></i>
                                                </button>
                                                <button onclick="eliminarRegistro('ventas', ${v.id})" class="btn-action btn-danger">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;

                datosActuales = ventas;

            } catch (error) {
                container.innerHTML = `
                    <div class="bg-red-500/10 border border-red-500/20 text-red-400 p-4 rounded-lg">
                        <i class="fas fa-exclamation-triangle mr-2"></i>
                        Error al cargar ventas: ${error.message}
                    </div>
                `;
            }
        }

        function buscarVentas() {
            const termino = document.getElementById('buscarVenta').value.toLowerCase();
            const filas = document.querySelectorAll('#tablaVentas tr');
            filas.forEach(fila => {
                const texto = fila.textContent.toLowerCase();
                fila.style.display = texto.includes(termino) ? '' : 'none';
            });
        }

        // ============================================
        // CLIENTES
        // ============================================
        async function cargarClientes() {
            const container = document.getElementById('contenidoDinamico');
            
            try {
                const response = await fetch(`${API_URL}/clientes`);
                const data = await response.json();
                const clientes = data.data || [];

                container.innerHTML = `
                    <div class="flex justify-between items-center mb-6">
                        <div class="flex gap-2">
                            <input type="text" id="buscarCliente" placeholder="Buscar cliente..." 
                                   class="bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-white text-sm focus:outline-none focus:border-blue-500">
                            <button onclick="buscarClientes()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                        <button onclick="abrirModal('clientes')" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm flex items-center gap-2">
                            <i class="fas fa-plus"></i> Nuevo Cliente
                        </button>
                    </div>
                    
                    <div class="table-container">
                        <div class="overflow-x-auto">
                            <table>
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Nombre</th>
                                        <th>Teléfono</th>
                                        <th>Email</th>
                                        <th>RUT</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaClientes">
                                    ${clientes.length === 0 ? `
                                        <tr>
                                            <td colspan="6" class="text-center text-slate-400 py-8">
                                                No hay clientes registrados
                                            </td>
                                        </tr>
                                    ` : clientes.map(c => `
                                        <tr>
                                            <td>${c.id}</td>
                                            <td><strong>${c.nombre}</strong></td>
                                            <td>${c.telefono || 'N/A'}</td>
                                            <td>${c.email || 'N/A'}</td>
                                            <td>${c.rut || 'N/A'}</td>
                                            <td>
                                                <button onclick="editarRegistro('clientes', ${c.id})" class="btn-action mr-1">
                                                    <i class="fas fa-edit"></i>
                                                </button>
                                                <button onclick="eliminarRegistro('clientes', ${c.id})" class="btn-action btn-danger">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;

                datosActuales = clientes;

            } catch (error) {
                container.innerHTML = `
                    <div class="bg-red-500/10 border border-red-500/20 text-red-400 p-4 rounded-lg">
                        <i class="fas fa-exclamation-triangle mr-2"></i>
                        Error al cargar clientes: ${error.message}
                    </div>
                `;
            }
        }

        function buscarClientes() {
            const termino = document.getElementById('buscarCliente').value.toLowerCase();
            const filas = document.querySelectorAll('#tablaClientes tr');
            filas.forEach(fila => {
                const texto = fila.textContent.toLowerCase();
                fila.style.display = texto.includes(termino) ? '' : 'none';
            });
        }

        // ============================================
        // COTIZACIONES
        // ============================================
        async function cargarCotizaciones() {
            const container = document.getElementById('contenidoDinamico');
            
            try {
                const response = await fetch(`${API_URL}/cotizaciones`);
                const data = await response.json();
                const cotizaciones = data.data || [];

                container.innerHTML = `
                    <div class="flex justify-between items-center mb-6">
                        <div class="flex gap-2">
                            <input type="text" id="buscarCotizacion" placeholder="Buscar cotización..." 
                                   class="bg-white/5 border border-white/10 rounded-lg px-4 py-2 text-white text-sm focus:outline-none focus:border-blue-500">
                            <button onclick="buscarCotizaciones()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                        <button onclick="abrirModal('cotizaciones')" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded-lg text-sm flex items-center gap-2">
                            <i class="fas fa-plus"></i> Nueva Cotización
                        </button>
                    </div>
                    
                    <div class="table-container">
                        <div class="overflow-x-auto">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Nº Cotización</th>
                                        <th>Cliente</th>
                                        <th>Servicios</th>
                                        <th>Total</th>
                                        <th>Estado</th>
                                        <th>Fecha</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaCotizaciones">
                                    ${cotizaciones.length === 0 ? `
                                        <tr>
                                            <td colspan="7" class="text-center text-slate-400 py-8">
                                                No hay cotizaciones registradas
                                            </td>
                                        </tr>
                                    ` : cotizaciones.map(c => `
                                        <tr>
                                            <td class="font-mono text-sm">${c.numero_cotizacion || 'N/A'}</td>
                                            <td>${c.cliente_nombre || 'Sin cliente'}</td>
                                            <td>${c.servicios || 'N/A'}</td>
                                            <td>$${Number(c.total).toLocaleString()}</td>
                                            <td><span class="badge badge-${(c.estado || 'pendiente').toLowerCase()}">${c.estado || 'Pendiente'}</span></td>
                                            <td class="text-sm text-slate-400">${c.fecha ? new Date(c.fecha).toLocaleDateString() : 'N/A'}</td>
                                            <td>
                                                <button onclick="editarRegistro('cotizaciones', ${c.id})" class="btn-action mr-1">
                                                    <i class="fas fa-edit"></i>
                                                </button>
                                                <button onclick="eliminarRegistro('cotizaciones', ${c.id})" class="btn-action btn-danger">
                                                    <i class="fas fa-trash"></i>
                                                </button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;

                datosActuales = cotizaciones;

            } catch (error) {
                container.innerHTML = `
                    <div class="bg-red-500/10 border border-red-500/20 text-red-400 p-4 rounded-lg">
                        <i class="fas fa-exclamation-triangle mr-2"></i>
                        Error al cargar cotizaciones: ${error.message}
                    </div>
                `;
            }
        }

        function buscarCotizaciones() {
            const termino = document.getElementById('buscarCotizacion').value.toLowerCase();
            const filas = document.querySelectorAll('#tablaCotizaciones tr');
            filas.forEach(fila => {
                const texto = fila.textContent.toLowerCase();
                fila.style.display = texto.includes(termino) ? '' : 'none';
            });
        }

        // ============================================
        // MODAL - ABRIR
        // ============================================
        function abrirModal(entidad, datos = null) {
            entidadActual = entidad;
            modoEdicion = !!datos;
            idEdicion = datos ? datos.id : null;

            const modal = document.getElementById('modalOverlay');
            const title = document.getElementById('modalTitle');
            const campos = document.getElementById('modalCampos');

            const nombres = {
                ventas: 'Venta',
                clientes: 'Cliente',
                cotizaciones: 'Cotización'
            };

            title.textContent = `${modoEdicion ? 'Editar' : 'Nueva'} ${nombres[entidad] || 'Registro'}`;

            let html = '';
            
            if (entidad === 'ventas') {
                html = `
                    <div class="mb-3">
                        <label class="block text-sm text-slate-400 mb-1">Cliente</label>
                        <input type="text" id="campo_cliente" class="modal-input" placeholder="Nombre del cliente" value="${datos?.cliente_nombre || ''}" required>
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm text-slate-400 mb-1">Teléfono</label>
                        <input type="text" id="campo_telefono" class="modal-input" placeholder="Teléfono" value="${datos?.cliente_telefono || ''}">
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm text-slate-400 mb-1">Producto</label>
                        <input type="text" id="campo_producto" class="modal-input" placeholder="Producto o servicio" value="${datos?.producto || ''}" required>
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm text-slate-400 mb-1">Monto</label>
                        <input type="number" id="campo_monto" class="modal-input" placeholder="0" value="${datos?.monto || ''}" required>
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm text-slate-400 mb-1">Forma de Pago</label>
                        <select id="campo_forma_pago" class="modal-input">
                            <option value="Efectivo" ${datos?.forma_pago === 'Efectivo' ? 'selected' : ''}>Efectivo</option>
                            <option value="Transferencia" ${datos?.forma_pago === 'Transferencia' ? 'selected' : ''}>Transferencia</option>
                            <option value="Tarjeta" ${datos?.forma_pago === 'Tarjeta' ? 'selected' : ''}>Tarjeta</option>
                            <option value="Crédito" ${datos?.forma_pago === 'Crédito' ? 'selected' : ''}>Crédito</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm text-slate-400 mb-1">Fecha de Emisión</label>
                        <input type="date" id="campo_fecha_emision" class="modal-input" value="${datos?.fecha_emision || ''}">
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm text-slate-400 mb-1">Boleta SII (PDF)</label>
                        <input type="file" id="campo_boleta_sii" class="modal-input" accept=".pdf">
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm text-slate-400 mb-1">Estado</label>
                        <select id="campo_estado" class="modal-input">
                            <option value="Pendiente" ${datos?.estado === 'Pendiente' ? 'selected' : ''}>Pendiente</option>
                            <option value="Pagado" ${datos?.estado === 'Pagado' ? 'selected' : ''}>Pagado</option>
                            <option value="Cancelado" ${datos?.estado === 'Cancelado' ? 'selected' : ''}>Cancelado</option>
                            <option value="Completado" ${datos?.estado === 'Completado' ? 'selected' : ''}>Completado</option>
                        </select>
                    </div>
                `;
            } else if (entidad === 'clientes') {
                html = `
                    <div class="mb-3">
                        <label class="block text-sm text-slate-400 mb-1">Nombre *</label>
                        <input type="text" id="campo_nombre" class="modal-input" placeholder="Nombre completo" value="${datos?.nombre || ''}" required>
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm text-slate-400 mb-1">Teléfono</label>
                        <input type="text" id="campo_telefono" class="modal-input" placeholder="Teléfono" value="${datos?.telefono || ''}">
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm text-slate-400 mb-1">Email</label>
                        <input type="email" id="campo_email" class="modal-input" placeholder="email@ejemplo.cl" value="${datos?.email || ''}">
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm text-slate-400 mb-1">RUT</label>
                        <input type="text" id="campo_rut" class="modal-input" placeholder="12.345.678-9" value="${datos?.rut || ''}">
                    </div>
                `;
            } else if (entidad === 'cotizaciones') {
                html = `
                    <div class="mb-3">
                        <label class="block text-sm text-slate-400 mb-1">Cliente</label>
                        <input type="text" id="campo_cliente" class="modal-input" placeholder="Nombre del cliente" value="${datos?.cliente_nombre || ''}" required>
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm text-slate-400 mb-1">Teléfono</label>
                        <input type="text" id="campo_telefono" class="modal-input" placeholder="Teléfono" value="${datos?.cliente_telefono || ''}">
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm text-slate-400 mb-1">Servicios</label>
                        <textarea id="campo_servicios" class="modal-input" rows="3" placeholder="Detalle de servicios">${datos?.servicios || ''}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm text-slate-400 mb-1">Total</label>
                        <input type="number" id="campo_total" class="modal-input" placeholder="0" value="${datos?.total || ''}" required>
                    </div>
                    <div class="mb-3">
                        <label class="block text-sm text-slate-400 mb-1">Estado</label>
                        <select id="campo_estado" class="modal-input">
                            <option value="Pendiente" ${datos?.estado === 'Pendiente' ? 'selected' : ''}>Pendiente</option>
                            <option value="Aprobada" ${datos?.estado === 'Aprobada' ? 'selected' : ''}>Aprobada</option>
                            <option value="Rechazada" ${datos?.estado === 'Rechazada' ? 'selected' : ''}>Rechazada</option>
                            <option value="Completada" ${datos?.estado === 'Completada' ? 'selected' : ''}>Completada</option>
                        </select>
                    </div>
                `;
            }

            campos.innerHTML = html;
            modal.classList.add('active');
            document.getElementById('modalMensaje').classList.add('hidden');
        }

        function cerrarModal() {
            document.getElementById('modalOverlay').classList.remove('active');
            modoEdicion = false;
            idEdicion = null;
        }

        // ============================================
        // GUARDAR REGISTRO
        // ============================================
        async function guardarRegistro(event) {
    event.preventDefault();
    
    const mensajeDiv = document.getElementById('modalMensaje');
    mensajeDiv.classList.add('hidden');

    try {
        let endpoint = '';
        let method = 'POST';
        let datos = {};
        const formData = new FormData();

        if (entidadActual === 'ventas') {
            const cliente = document.getElementById('campo_cliente').value.trim();
            const telefono = document.getElementById('campo_telefono').value.trim();
            const producto = document.getElementById('campo_producto').value.trim();
            const monto = document.getElementById('campo_monto').value;
            const forma_pago = document.getElementById('campo_forma_pago').value;
            const fecha_emision = document.getElementById('campo_fecha_emision').value;
            const fileInput = document.getElementById('campo_boleta_sii');
            const estado = document.getElementById('campo_estado').value;

            if (!cliente || !producto || !monto) {
                mostrarError('Completa todos los campos obligatorios');
                return false;
            }

            // ✅ Construimos el FormData con todos los campos
            formData.append('cliente', cliente);
            formData.append('telefono', telefono);
            formData.append('producto', producto);
            formData.append('monto', monto);
            formData.append('forma_pago', forma_pago);
            formData.append('fecha_emision', fecha_emision);
            formData.append('estado', estado);

            // ✅ Agregamos el PDF si existe
            if (fileInput && fileInput.files.length > 0) {
                formData.append('boleta', fileInput.files[0]);
            }

            endpoint = '/ventas';
        } else if (entidadActual === 'clientes') {
            const nombre = document.getElementById('campo_nombre').value.trim();
            const telefono = document.getElementById('campo_telefono').value.trim();
            const email = document.getElementById('campo_email').value.trim();
            const rut = document.getElementById('campo_rut').value.trim();

            if (!nombre) {
                mostrarError('El nombre es obligatorio');
                return false;
            }

            datos = { nombre, telefono, email, rut };
            endpoint = '/clientes';
        } else if (entidadActual === 'cotizaciones') {
            const cliente = document.getElementById('campo_cliente').value.trim();
            const telefono = document.getElementById('campo_telefono').value.trim();
            const servicios = document.getElementById('campo_servicios').value.trim();
            const total = document.getElementById('campo_total').value;
            const estado = document.getElementById('campo_estado').value;

            if (!cliente || !servicios || !total) {
                mostrarError('Completa todos los campos obligatorios');
                return false;
            }

            datos = { cliente, telefono, servicios, total, estado };
            endpoint = '/cotizaciones';
        }

        if (modoEdicion && idEdicion) {
            method = 'PUT';
            endpoint = `${endpoint}/${idEdicion}`;
        }

        let response;

        if (entidadActual === 'ventas') {
            // ✅ Para ventas usamos FormData (porque hay archivo)
            response = await fetch(`${API_URL}${endpoint}`, {
                method: method,
                body: formData  // NO usar JSON, ni Content-Type
            });
        } else {
            // ✅ Para clientes y cotizaciones usamos JSON normal
            response = await fetch(`${API_URL}${endpoint}`, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
        }

        const result = await response.json();

        if (result.success) {
            cerrarModal();
            recargarDatos();
        } else {
            mostrarError(result.message || 'Error al guardar');
        }

    } catch (error) {
        console.error('❌ Error completo:', error);
        mostrarError('Error de conexión: ' + error.message);
    }

    return false;
}

        function mostrarError(mensaje) {
            const mensajeDiv = document.getElementById('modalMensaje');
            mensajeDiv.textContent = '❌ ' + mensaje;
            mensajeDiv.className = 'bg-red-500/10 border border-red-500/20 text-red-400 p-3 rounded-lg text-sm';
            mensajeDiv.classList.remove('hidden');
        }

        async function editarRegistro(entidad, id) {
            try {
                const response = await fetch(`${API_URL}/${entidad}`);
                const data = await response.json();
                const registros = data.data || [];
                const registro = registros.find(r => r.id === id);

                if (registro) {
                    abrirModal(entidad, registro);
                } else {
                    alert('Registro no encontrado');
                }
            } catch (error) {
                alert('Error al cargar el registro: ' + error.message);
            }
        }

        async function eliminarRegistro(entidad, id) {
            if (!confirm('¿Estás seguro de eliminar este registro?')) return;

            try {
                const response = await fetch(`${API_URL}/${entidad}/${id}`, {
                    method: 'DELETE'
                });

                const result = await response.json();

                if (result.success) {
                    recargarDatos();
                } else {
                    alert('Error al eliminar: ' + (result.message || 'Desconocido'));
                }
            } catch (error) {
                alert('Error de conexión: ' + error.message);
            }
        }

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) cerrarModal();
        });
    </script>
</body>
</html>
